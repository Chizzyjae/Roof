<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JaeRoof Contact us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="Contactus1">
        <div class="Contactus2">
            <img src="https://static.vecteezy.com/system/resources/previews/077/586/042/large_2x/smiling-woman-with-headset-working-in-office-photo.jpg" alt="A lady wearing a headset.">
        </div>
        <div class="Contactus3">
            <h1>CONTACT US</h1>
            <form action="https://formspree.io/f/xzdywajj" method="post">
            
                <label for="Name">Name</label><br>
                <input type="text" id="Name" name="Name" placeholder="Your Name" required><br><br>
                <label for="Email">Email</label><br>
                <input type="email" id="Email" name="Email" placeholder="hello@domain.com   " required><br><br>
                <label for="PhoneNumber">Phone Number</label><br>
                <input type="tel" id="PhoneNumber" name="PhoneNumber" placeholder="Phone Number" maxlength="11" required><br><br>
                <label for="Message">How can we help you?</label><br>
                <textarea id="message" name="Message" placeholder="Description..." rows="5" required></textarea><br><br>
                <button type="submit">Get in Touch</button>
                </form>
        </div>
    </div>
</body>
</html>
